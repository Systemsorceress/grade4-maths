<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tom's Multiplication Quest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: "Nunito", sans-serif;

    color: #29313d;

    background:
        radial-gradient(
            circle at 10% 10%,
            #fff3d8 0,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 90%,
            #eee9ff 0,
            transparent 32%
        ),
        #f8f6f2;
}

button,
input {
    font-family: inherit;
}


/* =========================================================
   HEADER
========================================================= */

.header {
    height: 76px;

    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(255,255,255,.96);

    border-bottom: 1px solid #e6e1d9;

    position: sticky;
    top: 0;

    z-index: 100;

    backdrop-filter: blur(12px);
}

.logo {
    font-family: "Baloo 2";

    font-size: 27px;

    font-weight: 800;
}

.logo span {
    color: #7357e8;
}

.header-right {
    display: flex;

    align-items: center;

    gap: 18px;
}

.progress-wrapper {
    width: 190px;
}

.progress-label {
    font-size: 12px;

    color: #888;

    font-weight: 800;

    margin-bottom: 5px;
}

.progress-track {
    width: 100%;
    height: 9px;

    background: #e8e4dd;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    height: 100%;

    width: 0%;

    background: #7357e8;

    border-radius: 20px;

    transition: width .4s ease;
}

.stars {
    font-weight: 800;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    width: min(1120px, 94%);

    margin: auto;

    padding: 35px 0 60px;
}

.level-header {
    text-align: center;

    margin-bottom: 28px;
}

.level-badge {
    display: inline-flex;

    padding: 7px 16px;

    background: #eee9ff;

    color: #6548d7;

    border-radius: 30px;

    font-size: 14px;

    font-weight: 800;
}

.level-header h1 {
    margin: 7px 0 0;

    font-family: "Baloo 2";

    font-size: 42px;

    line-height: 1.1;
}

.level-header p {
    margin: 5px 0 0;

    color: #777;
}


/* =========================================================
   GAME GRID
========================================================= */

.game-grid {
    display: grid;

    grid-template-columns: .9fr 1.1fr;

    gap: 25px;
}


/* =========================================================
   TOM CARD
========================================================= */

.tom-card {
    min-height: 570px;

    padding: 25px;

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    background: white;

    border-radius: 28px;

    box-shadow:
        0 16px 45px rgba(50,40,80,.09);
}

.tom-image {
    width: 300px;
    height: 260px;

    object-fit: contain;

    margin-top: 105px;

    border-radius: 20px;

    transition: .3s;
}

.tom-image.change {
    animation: tomChange .5s ease;
}

@keyframes tomChange {

    0% {
        opacity: 0;

        transform:
            scale(.75)
            rotate(-3deg);
    }

    60% {
        transform:
            scale(1.06)
            rotate(2deg);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


/* =========================================================
   THINKING BUBBLE
========================================================= */

.thinking-bubble {
    position: absolute;

    top: 22px;
    right: 15px;

    width: 275px;

    padding: 17px 19px;

    background: white;

    border: 3px solid #ddd6ff;

    border-radius: 28px;

    color: #4d4568;

    font-weight: 800;

    line-height: 1.4;

    box-shadow:
        0 10px 25px rgba(50,40,80,.08);

    z-index: 5;

    animation: bubbleAppear .4s ease;
}

.thinking-bubble::before {
    content: "";

    position: absolute;

    bottom: -18px;
    left: 40px;

    width: 18px;
    height: 18px;

    background: white;

    border: 3px solid #ddd6ff;

    border-radius: 50%;
}

.thinking-bubble::after {
    content: "";

    position: absolute;

    bottom: -34px;
    left: 20px;

    width: 9px;
    height: 9px;

    background: white;

    border: 3px solid #ddd6ff;

    border-radius: 50%;
}

@keyframes bubbleAppear {

    from {
        opacity: 0;

        transform: scale(.8);
    }

    to {
        opacity: 1;

        transform: scale(1);
    }
}

.tom-status {
    text-align: center;

    margin-top: 20px;
}

.tom-status strong {
    font-size: 21px;
}

.tom-status p {
    color: #888;

    margin-top: 5px;
}


/* =========================================================
   MATH CARD
========================================================= */

.math-card {
    min-height: 570px;

    padding: 35px;

    background: white;

    border-radius: 28px;

    box-shadow:
        0 16px 45px rgba(50,40,80,.09);
}

.problem-number {
    color: #888;

    font-size: 14px;

    font-weight: 800;

    margin-bottom: 20px;
}


/* =========================================================
   VERTICAL QUESTION
========================================================= */

.vertical-work {
    width: 300px;

    margin: auto;

    font-family: "Baloo 2";

    font-size: 53px;

    font-weight: 800;

    line-height: 1;
}

.math-row {
    height: 62px;

    display: flex;

    align-items: center;

    justify-content: flex-end;
}

.operator {
    color: #7357e8;

    margin-right: 13px;
}


/* =========================================================
   CARRY
========================================================= */

.carry-row {
    height: 35px;

    display: flex;

    justify-content: flex-end;

    padding-right: 70px;
}

.carry-box {
    width: 35px;
    height: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #fff3ed;

    color: #df765d;

    border-radius: 8px;

    font-size: 22px;

    opacity: 0;

    transform: scale(.6);

    transition: .3s;
}

.carry-box.visible {
    opacity: 1;

    transform: scale(1);
}


/* =========================================================
   ANSWER LINE
========================================================= */

.answer-line {
    border-top: 5px solid #29313d;

    margin-top: 5px;

    padding-top: 10px;
}


/* =========================================================
   ⭐ FIXED PLACE-VALUE ANSWER BOARD ⭐

   The answer has TWO FIXED positions:

       TENS       ONES
        [ ]        [ ]

   They NEVER swap.

   Therefore:

       Step 1:
                    [6]

       Step 2:
             [3]    [6]

   = 36

========================================================= */

.answer-board {
    height: 70px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    gap: 6px;
}


/* Each digit gets its own permanent slot */

.place-slot {
    width: 58px;
    height: 58px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   STUDENT INPUT

   IMPORTANT:

   This is ONLY used when asking the student
   to type an answer.

   We NEVER modify the value.

   15 stays 15.
========================================================= */

.answer-input {
    width: 120px;
    height: 58px;

    border: 3px dashed #bcb5df;

    border-radius: 13px;

    background: #faf9ff;

    text-align: center;

    font-family: "Baloo 2";

    font-size: 34px;

    font-weight: 800;

    color: #44377f;

    outline: none;

    transition: .2s;
}

.answer-input:focus {
    border-color: #7357e8;

    background: #f4f1ff;

    transform: scale(1.03);
}

.answer-input.wrong {
    border-color: #df6969;

    background: #fff0f0;

    animation: shake .3s;
}

@keyframes shake {

    25% {
        transform: translateX(-5px);
    }

    50% {
        transform: translateX(5px);
    }

    75% {
        transform: translateX(-5px);
    }
}


/* =========================================================
   COMPLETED DIGIT

   Every digit belongs to its own place-value slot.
========================================================= */

.answer-digit {
    width: 58px;
    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #eaf8ee;

    border: 3px solid #4aaa69;

    border-radius: 13px;

    color: #287b45;

    font-family: "Baloo 2";

    font-size: 35px;

    font-weight: 800;

    position: absolute;

    inset: 0;

    margin: auto;
}


/* =========================================================
   ONES DIGIT APPEAR
========================================================= */

.ones-appear {
    animation: onesAppear .35s ease;
}

@keyframes onesAppear {

    from {
        opacity: 0;

        transform: scale(.3);
    }

    to {
        opacity: 1;

        transform: scale(1);
    }
}


/* =========================================================
   TENS DIGIT SWIPE

   The tens digit starts to the RIGHT,
   then slides into the TENS slot.

   It NEVER interacts with the ones digit.

========================================================= */

.tens-swipe {
    animation: tensSwipe .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes tensSwipe {

    0% {
        opacity: 0;

        transform:
            translateX(100px)
            scale(.65);
    }

    35% {
        opacity: 1;

        transform:
            translateX(55px)
            scale(1.08);
    }

    65% {

        transform:
            translateX(20px)
            scale(1.03);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


/* =========================================================
   TEACHING PANEL
========================================================= */

.teaching-panel {
    margin-top: 30px;

    padding: 20px;

    background: #faf8ff;

    border: 2px solid #ebe5ff;

    border-radius: 20px;
}

.step-title {
    font-family: "Baloo 2";

    font-size: 25px;

    color: #6348d5;
}

.step-message {
    margin-top: 5px;

    color: #666;

    line-height: 1.5;

    font-weight: 700;
}


/* =========================================================
   FEEDBACK
========================================================= */

.feedback {
    min-height: 30px;

    margin-top: 15px;

    text-align: center;

    font-weight: 800;
}

.feedback.good {
    color: #329257;
}

.feedback.bad {
    color: #d45a5a;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 12px;

    margin-top: 20px;
}

button {
    border: none;

    border-radius: 15px;

    padding: 13px 22px;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.check-btn {
    background: #7357e8;

    color: white;
}

.hint-btn {
    background: #fff0c7;

    color: #805d00;
}

.next-btn {
    display: none;

    background: #49a96a;

    color: white;
}


/* =========================================================
   MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(38,30,60,.55);

    backdrop-filter: blur(5px);

    z-index: 200;
}

.modal-box {
    width: min(460px, 90%);

    padding: 40px;

    text-align: center;

    background: white;

    border-radius: 30px;

    animation: modalPop .4s ease;
}

.trophy {
    font-size: 65px;
}

.modal-box h2 {
    margin: 10px 0;

    font-family: "Baloo 2";

    font-size: 35px;
}

.modal-box p {
    color: #777;

    line-height: 1.5;
}

@keyframes modalPop {

    from {
        opacity: 0;

        transform: scale(.7);
    }

    to {
        opacity: 1;

        transform: scale(1);
    }
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;

    top: -20px;

    width: 10px;
    height: 14px;

    z-index: 300;

    animation:
        fall 2s linear forwards;
}

@keyframes fall {

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px) {

    .game-grid {
        grid-template-columns: 1fr;
    }

    .tom-card,
    .math-card {
        min-height: auto;
    }

}

@media(max-width:550px) {

    .header {
        padding: 0 15px;
    }

    .logo {
        font-size: 21px;
    }

    .progress-wrapper {
        width: 90px;
    }

    .level-header h1 {
        font-size: 32px;
    }

    .math-card {
        padding: 20px;
    }

    .vertical-work {
        width: 250px;

        font-size: 45px;
    }

    .thinking-bubble {
        width: 215px;

        font-size: 14px;
    }

    .tom-image {
        width: 240px;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header class="header">

    <div class="logo">
        ✏️ Tom's
        <span>Math Quest</span>
    </div>


    <div class="header-right">

        <div class="progress-wrapper">

            <div class="progress-label">
                Progress
            </div>

            <div class="progress-track">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>


        <div
            id="stars"
            class="stars">

            ⭐ 0

        </div>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main class="main">


    <section class="level-header">

        <div
            id="levelBadge"
            class="level-badge">

            🎯 LEVEL 1

        </div>


        <h1 id="levelTitle">
            Multiplication Explorer
        </h1>


        <p id="levelSubtitle">
            Learn multiplication by helping Tom!
        </p>

    </section>



    <section class="game-grid">


        <!-- =================================================
             TOM
        ================================================== -->

        <div class="tom-card">


            <div
                id="thinkingBubble"
                class="thinking-bubble">

                💭 What is
                <strong>2 × 3</strong>?

            </div>


            <img
                id="tomImage"

                class="tom-image"

                src="https://tse3.mm.bing.net/th/id/OIP.1WQu5lcVv9i2OS24_T7J1QHaEd?r=0&rs=1&pid=ImgDetMain&o=7&rm=3"

                alt="Tom thinking">


            <div class="tom-status">

                <strong id="tomStatus">
                    Tom is thinking...
                </strong>

                <p>
                    Help Tom solve the problem!
                </p>

            </div>

        </div>



        <!-- =================================================
             MATH
        ================================================== -->

        <div class="math-card">


            <div
                id="problemNumber"
                class="problem-number">

                Problem 1

            </div>



            <div class="vertical-work">


                <!-- CARRY -->

                <div class="carry-row">

                    <div
                        id="carryBox"
                        class="carry-box">
                    </div>

                </div>


                <!-- TOP NUMBER -->

                <div class="math-row">

                    <span id="topNumber">
                        2
                    </span>

                </div>


                <!-- BOTTOM NUMBER -->

                <div class="math-row">

                    <span class="operator">
                        ×
                    </span>

                    <span id="bottomNumber">
                        3
                    </span>

                </div>


                <!-- ANSWER -->

                <div class="answer-line">

                    <!--
                        FIXED PLACE-VALUE BOARD

                        TENS | ONES
                    -->

                    <div
                        id="answerBoard"
                        class="answer-board">


                        <div
                            id="tensSlot"
                            class="place-slot">
                        </div>


                        <div
                            id="onesSlot"
                            class="place-slot">
                        </div>

                    </div>

                </div>

            </div>



            <!-- =================================================
                 TEACHING
            ================================================== -->

            <div class="teaching-panel">

                <div
                    id="stepTitle"
                    class="step-title">

                    Your Mission 🎯

                </div>


                <div
                    id="stepMessage"
                    class="step-message">

                    Think about the multiplication problem.

                </div>

            </div>



            <!-- FEEDBACK -->

            <div
                id="feedback"
                class="feedback">
            </div>



            <!-- ACTIONS -->

            <div class="actions">

                <button
                    id="hintButton"
                    class="hint-btn">

                    💡 Hint

                </button>


                <button
                    id="checkButton"
                    class="check-btn">

                    ✓ Check Answer

                </button>


                <button
                    id="nextButton"
                    class="next-btn">

                    Next Problem →

                </button>

            </div>

        </div>

    </section>

</main>



<!-- =======================================================
     LEVEL COMPLETE
======================================================= -->

<div
    id="completeModal"
    class="modal">


    <div class="modal-box">

        <div class="trophy">
            🏆
        </div>


        <h2 id="completeTitle">
            Level Complete!
        </h2>


        <p id="completeMessage">
            Great job!
        </p>


        <div
            style="
                font-size:25px;
                margin:20px;
            ">

            ⭐ ⭐ ⭐

        </div>


        <button
            id="continueButton"
            class="check-btn">

            Continue →

        </button>

    </div>

</div>



<script>

/* =========================================================
   TOM IMAGES
========================================================= */

const TOM_THINKING =
"https://tse3.mm.bing.net/th/id/OIP.1WQu5lcVv9i2OS24_T7J1QHaEd?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";

const TOM_CELEBRATING =
"https://i.ytimg.com/vi/-UKzxoi250E/hqdefault.jpg";


/* =========================================================
   PROBLEMS
========================================================= */

const level1Problems = [

    { a: 2, b: 3 },
    { a: 4, b: 2 },
    { a: 5, b: 3 },
    { a: 6, b: 4 },
    { a: 7, b: 3 }

];


const level2Problems = [

    { a: 12, b: 3 },
    { a: 14, b: 2 },
    { a: 21, b: 3 },
    { a: 23, b: 4 },
    { a: 32, b: 3 }

];


/* =========================================================
   GAME STATE
========================================================= */

let currentLevel = 1;

let currentProblem = 0;

let currentStep = 0;

let stars = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const topNumber =
document.getElementById("topNumber");

const bottomNumber =
document.getElementById("bottomNumber");

const tensSlot =
document.getElementById("tensSlot");

const onesSlot =
document.getElementById("onesSlot");

const thinkingBubble =
document.getElementById("thinkingBubble");

const tomImage =
document.getElementById("tomImage");

const tomStatus =
document.getElementById("tomStatus");

const stepTitle =
document.getElementById("stepTitle");

const stepMessage =
document.getElementById("stepMessage");

const feedback =
document.getElementById("feedback");

const checkButton =
document.getElementById("checkButton");

const nextButton =
document.getElementById("nextButton");

const hintButton =
document.getElementById("hintButton");

const progressBar =
document.getElementById("progressBar");

const starsDisplay =
document.getElementById("stars");

const carryBox =
document.getElementById("carryBox");


/* =========================================================
   GET CURRENT PROBLEM
========================================================= */

function getProblems() {

    return currentLevel === 1
        ? level1Problems
        : level2Problems;

}


function getProblem() {

    return getProblems()[currentProblem];

}


/* =========================================================
   TOM IMAGE
========================================================= */

function setTomImage(image) {

    tomImage.classList.remove("change");

    void tomImage.offsetWidth;

    tomImage.src = image;

    tomImage.classList.add("change");

}


/* =========================================================
   CREATE STUDENT INPUT
========================================================= */

function createInput() {

    /*
        Input is placed temporarily
        inside the ONES slot.

        Most importantly:

        THE VALUE IS NEVER REVERSED.
    */

    const oldInput =
        document.getElementById(
            "answerInput"
        );

    if (oldInput) {
        oldInput.remove();
    }


    const input =
        document.createElement("input");


    input.id =
        "answerInput";


    input.className =
        "answer-input";


    input.type =
        "text";


    input.inputMode =
        "numeric";


    input.autocomplete =
        "off";


    input.maxLength =
        4;


    /*
        Only allow numbers.

        No reverse().
        No splitting.
        No rearranging.
    */

    input.addEventListener(
        "input",
        function() {

            this.value =
                this.value.replace(
                    /[^0-9]/g,
                    ""
                );

        }
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                checkAnswer();

            }

        }
    );


    /*
        For Level 1 the input can
        sit across the answer area.

        For Level 2 it appears as
        the active answer box.
    */

    if (currentLevel === 1) {

        document
            .getElementById("answerBoard")
            .appendChild(input);

    }

    else {

        /*
            If we are asking for a digit,
            place the input over the active slot.
        */

        if (currentStep === 0) {

            onesSlot.appendChild(
                input
            );

        }

        else {

            tensSlot.appendChild(
                input
            );

        }

    }


    setTimeout(
        () => input.focus(),
        50
    );


    return input;

}


/* =========================================================
   REMOVE INPUT
========================================================= */

function removeInput() {

    const input =
        document.getElementById(
            "answerInput"
        );


    if (input) {

        input.remove();

    }

}


/* =========================================================
   CLEAR ANSWER SLOTS
========================================================= */

function clearAnswerSlots() {

    tensSlot.innerHTML = "";

    onesSlot.innerHTML = "";

}


/* =========================================================
   ADD ONES DIGIT
========================================================= */

function showOnesDigit(value) {

    /*
        ONES ALWAYS GOES INTO ONES SLOT.

        For:

            12 × 3

        Step 1:

            [ ] [6]

    */

    onesSlot.innerHTML = "";


    const digit =
        document.createElement("div");


    digit.className =
        "answer-digit ones-appear";


    digit.textContent =
        String(value);


    onesSlot.appendChild(
        digit
    );

}


/* =========================================================
   ADD TENS DIGIT
========================================================= */

function showTensDigit(value) {

    /*
        TENS ALWAYS GOES INTO TENS SLOT.

        Existing:

            [ ] [6]

        New:

            [3] [6]

        There is NO DOM reordering.

        The 6 stays in the ONES slot.
    */

    tensSlot.innerHTML = "";


    const digit =
        document.createElement("div");


    digit.className =
        "answer-digit tens-swipe";


    digit.textContent =
        String(value);


    tensSlot.appendChild(
        digit
    );

}


/* =========================================================
   LOAD PROBLEM
========================================================= */

function loadProblem() {

    const p =
        getProblem();


    currentStep = 0;


    topNumber.textContent =
        String(p.a);


    bottomNumber.textContent =
        String(p.b);


    clearAnswerSlots();


    carryBox.textContent =
        "";

    carryBox.classList.remove(
        "visible"
    );


    feedback.textContent =
        "";

    feedback.className =
        "feedback";


    checkButton.style.display =
        "inline-block";


    nextButton.style.display =
        "none";


    setTomImage(
        TOM_THINKING
    );


    document.getElementById(
        "problemNumber"
    ).textContent =
        `Problem ${currentProblem + 1}`;


    if (currentLevel === 1) {

        thinkingBubble.innerHTML =
            `💭 What is <strong>${p.a} × ${p.b}</strong>?`;


        stepTitle.textContent =
            "Your Mission 🎯";


        stepMessage.textContent =
            `Think about ${p.a} × ${p.b}.`;


        tomStatus.textContent =
            "Tom is thinking...";


        createInput();

    }

    else {

        const ones =
            p.a % 10;


        thinkingBubble.innerHTML =
            `💭 Start from the <strong>RIGHT</strong>.`;


        stepTitle.textContent =
            "Step 1 🧠";


        stepMessage.innerHTML =
            `Start from the <strong>RIGHT</strong>. Multiply <strong>${p.b} × ${ones}</strong>.`;


        tomStatus.textContent =
            "Tom is working from the right!";


        createInput();

    }


    updateProgress();

}


/* =========================================================
   LEVEL 1 CHECK
========================================================= */

function checkLevel1() {

    const p =
        getProblem();


    const input =
        document.getElementById(
            "answerInput"
        );


    if (!input) {
        return;
    }


    /*
        CRITICAL:

        Read EXACTLY what the student typed.

        Example:

            student types 15

        typed = "15"

        Number("15") = 15

        Nothing is reversed.
    */

    const typed =
        input.value.trim();


    if (typed === "") {

        wrongAnswer(
            "Enter your answer first."
        );

        return;

    }


    const value =
        Number(typed);


    const correct =
        p.a * p.b;


    if (value !== correct) {

        wrongAnswer(
            `Think about ${p.a} × ${p.b}.`
        );

        return;

    }


    /*
        Correct!

        Remove the input.
    */

    removeInput();


    /*
        DISPLAY COMPLETE ANSWER
        LEFT → RIGHT.

        Example:

            15

        becomes:

            tens slot = 1
            ones slot = 5

        NOT 51.
    */

    const digits =
        String(correct);


    if (digits.length === 1) {

        showOnesDigit(
            digits[0]
        );

    }

    else {

        showTensDigit(
            digits[0]
        );

        showOnesDigit(
            digits[1]
        );

    }


    finishProblem(
        correct
    );

}


/* =========================================================
   LEVEL 2 CHECK
========================================================= */

function checkLevel2() {

    const p =
        getProblem();


    const input =
        document.getElementById(
            "answerInput"
        );


    if (!input) {
        return;
    }


    /*
        AGAIN:

        NEVER reverse student input.
    */

    const typed =
        input.value.trim();


    if (typed === "") {

        wrongAnswer(
            "Enter your answer first."
        );

        return;

    }


    const value =
        Number(typed);


    const ones =
        p.a % 10;


    const tens =
        Math.floor(
            p.a / 10
        );


    /* =====================================================
       STEP 1
    ===================================================== */

    if (currentStep === 0) {


        const onesProduct =
            ones * p.b;


        /*
            Student is entering ONE digit
            for the ones place.

            If answer is 6:

                correct = 6

        */

        const correctOnes =
            onesProduct % 10;


        if (
            value !== correctOnes
        ) {

            wrongAnswer(
                `Start from the RIGHT. Calculate ${p.b} × ${ones}.`
            );

            return;

        }


        /*
            STEP 1 CORRECT
        */

        removeInput();


        /*
            KEEP the 6.

                [ ] [6]

            It will remain there during Step 2.
        */

        showOnesDigit(
            correctOnes
        );


        /*
            Calculate carry.
        */

        const carry =
            Math.floor(
                onesProduct / 10
            );


        if (carry > 0) {

            carryBox.textContent =
                carry;

            carryBox.classList.add(
                "visible"
            );

        }


        feedback.textContent =
            `🎉 Great! ${p.b} × ${ones} = ${onesProduct}.`;

        feedback.className =
            "feedback good";


        currentStep = 1;


        /*
            Now ask for tens digit.

            Existing 6 stays.

                [ ] [6]

        */

        thinkingBubble.innerHTML =
            `💭 Great! Now move <strong>LEFT</strong>.`;


        stepTitle.textContent =
            "Step 2 🧠";


        if (carry > 0) {

            stepMessage.innerHTML =
                `See the carry <strong>${carry}</strong>. Now calculate <strong>${p.b} × ${tens}</strong> and add the carry.`;

        }

        else {

            stepMessage.innerHTML =
                `No carry! Now calculate <strong>${p.b} × ${tens}</strong>.`;

        }


        tomStatus.textContent =
            "Tom is moving LEFT!";


        /*
            IMPORTANT:

            The 6 remains in onesSlot.

            The new input goes ONLY
            into tensSlot.
        */

        createInput();


        return;

    }


    /* =====================================================
       STEP 2
    ===================================================== */

    if (currentStep === 1) {


        const onesProduct =
            ones * p.b;


        const carry =
            Math.floor(
                onesProduct / 10
            );


        const tensProduct =
            tens * p.b;


        const correctTens =
            tensProduct + carry;


        /*
            For this beginner version,
            the tens answer should be one digit.

            Example:

                12 × 3

                3 × 1 = 3

                carry = 0

                tens = 3
        */


        if (
            value !== correctTens
        ) {

            if (carry > 0) {

                wrongAnswer(
                    `Multiply ${p.b} × ${tens}, then add the carry ${carry}.`
                );

            }

            else {

                wrongAnswer(
                    `Multiply ${p.b} × ${tens}.`
                );

            }

            return;

        }


        /*
            STEP 2 CORRECT
        */

        removeInput();


        /*
            ADD TENS DIGIT.

            This is the critical part.

            Before:

                [ ] [6]

            After:

                [3] [6]

            The 6 NEVER moves in the DOM.

            Therefore it can NEVER become 63.
        */

        showTensDigit(
            correctTens
        );


        const finalAnswer =
            p.a * p.b;


        feedback.textContent =
            `🎉 Correct! ${p.a} × ${p.b} = ${finalAnswer}`;

        feedback.className =
            "feedback good";


        /*
            Give the animation a moment
            before Tom celebrates.
        */

        setTimeout(
            function() {

                finishProblem(
                    finalAnswer
                );

            },

            650
        );

    }

}


/* =========================================================
   FINISH PROBLEM
========================================================= */

function finishProblem(
    answer
) {

    thinkingBubble.innerHTML =
        `🤩 YES! <strong>${getProblem().a} × ${getProblem().b} = ${answer}</strong>`;


    tomStatus.textContent =
        "Tom is celebrating! 🎉";


    setTomImage(
        TOM_CELEBRATING
    );


    stepTitle.textContent =
        "Excellent Work! 🏆";


    stepMessage.innerHTML =
        `You solved it! The answer is <strong>${answer}</strong>.`;


    checkButton.style.display =
        "none";


    nextButton.style.display =
        "inline-block";


    stars++;


    starsDisplay.textContent =
        `⭐ ${stars}`;


    createConfetti();

}


/* =========================================================
   WRONG ANSWER
========================================================= */

function wrongAnswer(
    message
) {

    const input =
        document.getElementById(
            "answerInput"
        );


    if (input) {

        input.classList.remove(
            "wrong"
        );


        void input.offsetWidth;


        input.classList.add(
            "wrong"
        );

    }


    feedback.textContent =
        "Not quite! 💭 " + message;


    feedback.className =
        "feedback bad";


    thinkingBubble.innerHTML =
        "💭 Let's think again!";


    tomStatus.textContent =
        "You can do it!";

}


/* =========================================================
   HINT
========================================================= */

function showHint() {

    const p =
        getProblem();


    if (currentLevel === 1) {

        thinkingBubble.innerHTML =
            `💡 Think of <strong>${p.a}</strong> groups of ${p.b}.`;


        stepMessage.innerHTML =
            `${p.a} × ${p.b} means adding ${p.b} ${p.a} times.`;

        return;

    }


    const ones =
        p.a % 10;


    const tens =
        Math.floor(
            p.a / 10
        );


    if (currentStep === 0) {

        thinkingBubble.innerHTML =
            `💡 Look at the <strong>RIGHTMOST</strong> digit: ${ones}.`;


        stepMessage.innerHTML =
            `Multiply <strong>${p.b} × ${ones}</strong>.`;

    }

    else {

        thinkingBubble.innerHTML =
            `💡 Now move one place <strong>LEFT</strong>.`;


        stepMessage.innerHTML =
            `Multiply <strong>${p.b} × ${tens}</strong>.`;

    }

}


/* =========================================================
   BUTTONS
========================================================= */

checkButton.addEventListener(
    "click",
    checkAnswer
);


hintButton.addEventListener(
    "click",
    showHint
);


nextButton.addEventListener(
    "click",
    function() {

        currentProblem++;


        if (
            currentProblem >=
            getProblems().length
        ) {

            showLevelComplete();

        }

        else {

            loadProblem();

        }

    }
);


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer() {

    if (currentLevel === 1) {

        checkLevel1();

    }

    else {

        checkLevel2();

    }

}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function showLevelComplete() {

    const modal =
        document.getElementById(
            "completeModal"
        );


    if (currentLevel === 1) {

        document.getElementById(
            "completeTitle"
        ).textContent =
            "Level 1 Complete! 🎉";


        document.getElementById(
            "completeMessage"
        ).textContent =
            "Fantastic! Now let's learn 2-digit multiplication.";

    }

    else {

        document.getElementById(
            "completeTitle"
        ).textContent =
            "Multiplication Master! 🏆";


        document.getElementById(
            "completeMessage"
        ).textContent =
            "Amazing! You learned to work from RIGHT to LEFT.";

    }


    modal.style.display =
        "flex";

}


/* =========================================================
   CONTINUE TO NEXT LEVEL
========================================================= */

document.getElementById(
    "continueButton"
).addEventListener(
    "click",
    function() {


        document.getElementById(
            "completeModal"
        ).style.display =
            "none";


        if (currentLevel === 1) {


            currentLevel = 2;

            currentProblem = 0;

            currentStep = 0;


            document.getElementById(
                "levelBadge"
            ).textContent =
                "🧠 LEVEL 2";


            document.getElementById(
                "levelTitle"
            ).textContent =
                "2-Digit Multiplication";


            document.getElementById(
                "levelSubtitle"
            ).textContent =
                "Work from RIGHT to LEFT with Tom!";


            loadProblem();

        }

        else {


            currentLevel = 1;

            currentProblem = 0;

            currentStep = 0;


            document.getElementById(
                "levelBadge"
            ).textContent =
                "🎯 LEVEL 1";


            document.getElementById(
                "levelTitle"
            ).textContent =
                "Multiplication Explorer";


            document.getElementById(
                "levelSubtitle"
            ).textContent =
                "Learn multiplication by helping Tom!";


            loadProblem();

        }

    }
);


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const total =
        getProblems().length;


    const percentage =
        (currentProblem / total) * 100;


    progressBar.style.width =
        percentage + "%";

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {

    const confettiColors = [

        "#7357e8",
        "#f2b84b",
        "#49a96a",
        "#df765d",
        "#5b9bd5"

    ];


    for (
        let i = 0;
        i < 35;
        i++
    ) {


        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.animationDelay =
            Math.random() * .5 +
            "s";


        piece.style.background =
            confettiColors[
                Math.floor(
                    Math.random() *
                    confettiColors.length
                )
            ];


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => piece.remove(),
            2500
        );

    }

}


/* =========================================================
   START GAME
========================================================= */

loadProblem();

</script>
