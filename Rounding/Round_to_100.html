.slide::before{

.slide::after{

.check-btn,

.reset-btn{

.check-btn{

.secondary-btn{

.check-btn:hover,
.secondary-btn:hover,

.home-btn:hover,

.controls{

.controls-left,

.controls button{

}

.nav-disabled{

}

.menu-overlay{
  position:absolute;
  inset:0;
  background:rgba(24,53,42,.55);

.menu-overlay.open{

.menu-panel{

}

.menu-title{

<script>
/* ============================================================
   ROUNDING TO THE NEAREST 100
   Standalone educational deck — HTML/CSS/Vanilla JS only
   ============================================================ */

const TOTAL_SLIDES = 28;

const slideData = [
  {
    title:"Mom’s Park Challenge 🌳",
    type:"park",
    prompt:`Your mom says:<br><strong>“You can go and play at the nearby park. Choose the park that is nearest to our house!”</strong><br><br>You are standing at <strong>247 metres</strong> from the starting point.`,
    number:247,
    lower:200,
    upper:300,
    correct:"upper",
    explanation:"247 is 47 metres from 200 and 53 metres from 300, so Park B is nearer. Therefore, 247 rounds to 200.",
    teacher:"Ask: “Which park would you reach first?” Then connect the story to rounding: the nearest hundred is 200."
  },
  {
    title:"Let’s Find the Nearest Park",
    type:"line",
    number:247,
    lower:200,
    upper:300,
    answer:200,
    explanation:"247 is 47 metres from 200 and 53 metres from 300. Park A is closer, so 247 rounds to 200.",
    teacher:"Emphasise that the nearest park in the story is 200 m. Rounding means choosing the nearest multiple of 100."
  },
  {
    title:"What Does Nearest Mean?",
    type:"concept",
    number:247,
    lower:200,

/* ---------- Mathematical helper ---------- */
function round100(n){
  const remainder = n % 100;
  return remainder < 50 ? n - remainder : n + (100 - remainder);
}

function escapeHTML(value){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function choosePark(index,choice){
  const data = slideData[index];

  lower.classList.remove("selected","correct","incorrect");
  upper.classList.remove("selected","correct","incorrect");

  const clicked = choice==="lower" ? lower : upper;
  clicked.classList.add("selected");

  const correct = choice===data.correct;

  if(correct){
    clicked.classList.add("correct");
    feedback.className = "feedback correct pop";
    feedback.innerHTML = `✅ Great choice! ${data.explanation}`;
    award(index);
  }else{
    clicked.classList.add("incorrect");
    feedback.className = "feedback incorrect pop";
    const dLow = Math.abs(data.number-data.lower);
    const dUp = Math.abs(data.upper-data.number);
    feedback.innerHTML = `🌱 Not quite. ${data.number} is ${dLow} m from ${data.lower} and ${dUp} m from ${data.upper}. Try again!`;
  }
}

/* ---------- Number line ---------- */
function numberLineHTML(number,lower,upper,showMarker=true){
  const range = upper-lower;
  const position = Math.max(0,Math.min(100,((number-lower)/range)*100));

  const ticks = [];
  for(let n=lower;n<=upper;n+=10){
    const p=((n-lower)/range)*100;
    ticks.push(`
      <span class="nl-point ${n===lower||n===upper?"major":""}" style="left:${p}%"></span>
      <span class="nl-label" style="left:${p}%">${n}</span>
    `);
  }

  return `
    <div class="number-line-card card">
      <div class="number-line">
        <div class="line-track"></div>
        ${ticks.join("")}
        ${showMarker ? `
          <div class="nl-marker" style="left:${position}%">
            <span class="mini-char">🧒</span>
            <span class="marker-number">${number}</span>
          </div>
        `:""}
      </div>
    </div>
  `;
}

function lineChoice(index,value){
  const data=slideData[index];
  const host=document.getElementById(`content-${index}`);
  const buttons=host.querySelectorAll(".option");
  buttons.forEach(b=>b.classList.remove("correct","wrong"));

  const selected=[...buttons].find(b=>Number(b.textContent)===value);
  if(value===data.answer){
    selected.classList.add("correct");
    const fb=document.getElementById(`feedback-${index}`) || createFeedback(index);
    fb.className="feedback correct pop";
    fb.innerHTML=`✅ Correct! ${data.explanation}`;
    award(index);
  }else{
    selected.classList.add("wrong");
    const fb=document.getElementById(`feedback-${index}`) || createFeedback(index);
    fb.className="feedback incorrect pop";
    fb.innerHTML=`🌱 Try again. Look at the two distances on the number line.`;
  }
}

  const div=document.createElement("div");
  div.id=`feedback-${index}`;

function middleAnswer(index,choice){
  const data=slideData[index];
  const correct=data.answer==="both" ? choice==="both" : choice==="upper";
  const buttons=document.querySelectorAll(`#content-${index} .option`);
  buttons.forEach(b=>b.classList.remove("correct","wrong"));

  const labels={
    lower:String(data.lower),
    upper:String(data.upper),
    both:"Both are equally near"
  };

  const selected=[...buttons].find(b=>b.textContent.trim()===labels[choice]);
  if(selected) selected.classList.add(correct?"correct":"wrong");

  const fb=document.getElementById(`feedback-${index}`);
  fb.className=`feedback ${correct?"correct":"incorrect"} pop`;

  if(correct){
    fb.innerHTML=`${data.answer==="both" ? "🌟 Exactly! Both parks are 50 metres away.":"✅ Correct!"} ${data.explanation}`;
    award(index);
  }else{
    fb.innerHTML=`🌱 Look carefully: both endpoints are 50 metres away. For rounding, the exact-middle rule chooses the next hundred.`;
  }
}

function setupDrag(index){
  const char=document.getElementById(`drag-character-${index}`);
  const track=document.getElementById(`drag-track-${index}`);
  if(!char || !track) return;

  let dragging=false;

  function move(clientX){
    const rect=track.getBoundingClientRect();
    let pct=((clientX-rect.left)/rect.width)*100;
    pct=Math.max(0,Math.min(100,pct));
    char.style.left=pct+"%";
    char.dataset.value=Math.round(300+(pct/100)*100);
  }

  char.addEventListener("pointerdown",e=>{
    dragging=true;
    char.setPointerCapture(e.pointerId);
  });

  char.addEventListener("pointermove",e=>{
    if(dragging) move(e.clientX);
  });

  char.addEventListener("pointerup",()=>dragging=false);

  char.addEventListener("keydown",e=>{
    let value=Number(char.dataset.value)||350;
    if(e.key==="ArrowLeft") value=Math.max(300,value-1);
    if(e.key==="ArrowRight") value=Math.min(400,value+1);
    char.dataset.value=value;
    char.style.left=((value-300)/100*100)+"%";
  });
}

}

  if(sub){

      answered.add(key);
      score++;
      updateScoreDisplays();

  }else{

      answered.add(key);

}

  document.querySelectorAll(".teacher-panel").forEach(p=>p.classList.remove("open"));

  const btn=document.querySelector(`#slide-${current+1} .teacher-toggle`);
  if(btn) btn.setAttribute("aria-expanded","false");

  renderTeacherPanel(index);

  if(slideData[index].type==="drag"){
    setTimeout(()=>setupDrag(index),50);
  }

  const host=document.getElementById(`content-${index}`);
  if(host) host.classList.add("float-in");
}

function nextSlide(){
  if(current<TOTAL_SLIDES-1){
    showSlide(current+1);
  }
}

function previousSlide(){
  if(current>0){
    showSlide(current-1);
  }
}

function goToSlide(index){
  closeMenu();
  showSlide(index);
}

function openMenu(){
  document.getElementById("menuOverlay").classList.add("open");
  const items=document.querySelectorAll(".menu-item");
  items.forEach((item,i)=>item.classList.toggle("current",i===current));
}

function closeMenu(){
  document.getElementById("menuOverlay").classList.remove("open");
}

function resetSlide(){
  const data=slideData[current];

  // Re-render current slide content while preserving navigation.
  renderSlideContent(current,data);

  if(data.teacher){
    renderTeacherPanel(current);
  }

  if(data.type==="drag"){
    setTimeout(()=>setupDrag(current),50);
  }
}

function resetAll(){
  score=0;
  answered.clear();
  window.builderPark=false;
  showSlide(0);
}

/* ---------- Keyboard navigation ---------- */
document.addEventListener("keydown",e=>{
  const menu=document.getElementById("menuOverlay");

  if(menu && menu.classList.contains("open")){
    if(e.key==="Escape") closeMenu();
    return;
  }

  const tag=e.target.tagName.toLowerCase();

  if(tag==="input" || tag==="textarea" || tag==="select") return;

  if(e.key==="ArrowRight"){
    e.preventDefault();
    nextSlide();
  }else if(e.key==="ArrowLeft"){
    e.preventDefault();
    previousSlide();
  }else if(e.key==="Home"){
    e.preventDefault();
    openMenu();
  }else if(e.key>="1" && e.key<="9"){
    const n=Number(e.key);
    if(n<=TOTAL_SLIDES) goToSlide(n-1);
  }else if(e.key==="0"){
    goToSlide(9);
  }
});

/* ---------- Escape menu click ---------- */
document.addEventListener("click",e=>{
  const overlay=document.getElementById("menuOverlay");
  if(e.target===overlay) closeMenu();
});

/* ---------- Initial render ---------- */
createSlides();
showSlide(0);
</script>
</body>
</html>
